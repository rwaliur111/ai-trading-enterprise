version: '3.8'
services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--requirepass your-redis-password

  # For development only - not needed for Vercel
  supabase-local:
    image: supabase/postgres:15.1.0.49
    environment:
      POSTGRES_PASSWORD: your-local-password
    ports:
      - "5432:5432"

volumes:
  redis_data: